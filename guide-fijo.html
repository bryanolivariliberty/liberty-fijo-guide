  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- AUTH GUARD — redirect to login if no valid session                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <script>
// ── Seamless sign-in between the B2B tools and the B2B Sales Hub (UAT) ──
// The other tool (or the hub) opens this page with #lbsso=<token>: the session
// sign-in plus the rep's details and language. Valid 10 minutes; removed from
// the address bar right away. Same password hash as the login page.
(function(){
  var H='524046e112509a42c9b95545ca26e29276dfa9485100cdb0637f38453425beaf';
  try{
    var m = location.hash.match(/[#&]lbsso=([^&]+)/);
    if(m){
      var d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
      if(d && d.a===H && (Date.now()-(+d.t||0)) < 600000){
        sessionStorage.setItem('lb_auth', H);
        if(d.rep && d.rep.name) sessionStorage.setItem('lb_onboard', JSON.stringify(d.rep));
        if(d.lang==='en'||d.lang==='es') sessionStorage.setItem('lb_sso_lang', d.lang);
      }
      history.replaceState(null,'',location.pathname+location.search);
    }
  }catch(e){}
  window.lbSsoUrl = function(base, curLang){
    try{
      if(sessionStorage.getItem('lb_auth')!==H) return base;
      var rep=null; try{ rep=JSON.parse(sessionStorage.getItem('lb_onboard')||'null'); }catch(e){}
      var d={a:H, t:Date.now(), rep:rep, lang:curLang||''};
      return String(base).split('#')[0]+'#lbsso='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));
    }catch(e){ return base; }
  };
})();
    (function(){
      var H='524046e112509a42c9b95545ca26e29276dfa9485100cdb0637f38453425beaf';
      if(sessionStorage.getItem('lb_auth')!==H) window.location.replace('index.html');
    })();
  </script>
